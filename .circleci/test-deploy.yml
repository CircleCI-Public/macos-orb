version: 2.1
orbs:
  macos-orb: circleci/macos@dev:<<pipeline.git.revision>>
  orb-tools: circleci/orb-tools@11.5

filters: &filters
  tags:
    only: /.*/

executors:
  macos:
    parameters:
      xcode:
        type: string

    resource_class: m4pro.medium
    macos:
      xcode: << parameters.xcode >>

jobs:
  integration-test-xcode:
    parameters:
      ruby-version:
        default: "3.2"
        type: string
      device-name:
        type: string
      device-platform:
        type: string
      device-version:
        type: string
      executor:
        type: executor

    executor: << parameters.executor >>

    steps:
        - checkout
        - macos-orb/switch-ruby:
            version: << parameters.ruby-version >>
        - run:
            name: Verify Ruby version
            command: ruby -v | grep "ruby << parameters.ruby-version >>"
        - macos-orb/list-permission-types
        - macos-orb/list-permissions
        - macos-orb/add-uitest-permissions
        - run:
            command: bundle install
            working_directory: ~/project/sample_mac_project
        - run:
            name: Check macOS App UITesting Enabled
            command: bundle exec fastlane testandbuild
            working_directory: ~/project/sample_mac_project
        - macos-orb/add-safari-permissions
        - run:
            name: Check Safari Testing
            command: |
              npm install
              npm run testci
            working_directory: ~/project/sample_browser_project
        - store_test_results:
            path: sample_browser_project/test_results
        - macos-orb/list-permissions
        - macos-orb/preboot-simulator:
            device: << parameters.device-name >>
            platform: << parameters.device-platform >>
            version: << parameters.device-version >>
        - macos-orb/enable-vnc

workflows:
  test-deploy:
    jobs:
      - integration-test-xcode:
          name: "integration-test-xcode-26-5"
          ruby-version: "3.2"
          device-name: "iPhone 16"
          device-platform: "iOS"
          device-version: "26.5"
          executor:
            name: "macos"
            xcode: "26.5.0"
          filters: *filters
      - integration-test-xcode:
          name: "integration-test-xcode-16-4"
          ruby-version: "3.2"
          device-name: "iPhone 16"
          device-platform: "iOS"
          device-version: "18.5"
          executor:
            name: "macos"
            xcode: "16.4.0"
          filters: *filters
      - integration-test-xcode:
          name: "integration-test-xcode-15-4"
          ruby-version: "3.2"
          device-name: "iPhone 15"
          device-platform: "iOS"
          device-version: "17.5"
          executor:
            name: "macos"
            xcode: "15.4.0"
          filters: *filters
      - integration-test-xcode:
          name: "integration-test-xcode-14"
          ruby-version: "3.2"
          device-name: "iPhone 14"
          device-platform: "iOS"
          device-version: "16.4"
          executor:
            name: "macos"
            xcode: "14.3.1"
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/publish:
          orb-name: circleci/macos
          vcs-type: << pipeline.project.type >>
          enable-pr-comment: false
          pub-type: production
          requires:
            - orb-tools/pack
            - integration-test-xcode-26-5
            - integration-test-xcode-16-4
            - integration-test-xcode-15-4
            - integration-test-xcode-14
          context: orb-publisher
          github-token: GHI_TOKEN
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
